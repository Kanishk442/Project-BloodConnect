<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments - BloodConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>

        .page-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .stats-summary {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .stat-summary-card {
            flex: 0 1 auto;
            min-width: 160px;
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .stat-summary-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--card-shadow);
        }

        .stat-summary-number {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-summary-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .filter-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1.25rem;
            border-radius: 2rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .appointments-table {
            width: 100%;
            border-collapse: collapse;
        }

        .appointments-table th {
            text-align: left;
            padding: 1rem 1.25rem;
            background: var(--bg-tertiary);
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .appointments-table td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .action-btn-cancel {
            padding: 0.375rem 0.875rem;
            border-radius: 0.5rem;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: none;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .action-btn-cancel:hover {
            background: #ef4444;
            color: white;
        }

        .book-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--primary-gradient);
            color: white;
            padding: 0.75rem 1.75rem;
            border-radius: 0.75rem;
            text-decoration: none;
            font-weight: 600;
        }@media (max-width: 768px) {


            .stats-summary { flex-direction: column; }
            .stat-summary-card { min-width: auto; }
        

}


    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div>
                <a href="/" class="logo">
                    <span class="logo-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5S5.5 13.8 5.5 20.2a10.5 10.5 0 0 0 21 0C26.5 13.8 16 2.5 16 2.5z" fill="#d62839"/><path d="M16 14v8M12 18h8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></span>
                    <span class="logo-text">Blood<b>Connect</b></span>
                </a>
            </div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html"><i data-icon="grid"></i> Dashboard</a></li>
                <li><a href="appointments.html" class="active"><i data-icon="calendar"></i> Appointments</a></li>
                <li><a href="book-appointment.html"><i data-icon="plus-circle"></i> Book Appointment</a></li>
                <li><a href="alerts.html"><i data-icon="bell"></i> Alerts</a></li>
            </ul>
            <div class="theme-toggle-sidebar">
                <div class="theme-toggle" id="themeToggle">
                    <span class="theme-toggle-icon" data-theme="light"><i data-icon="sun"></i> Light</span>
                    <span class="theme-toggle-icon" data-theme="dark"><i data-icon="moon"></i> Dark</span>
                </div>
            </div>
            <div style="margin-top: 1rem;">
                <a href="#" onclick="logout()" class="btn-logout"><i data-icon="log-out"></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>My Appointments</h1>
                <p>View and manage your blood donation appointments</p>
            </div>

            <div class="stats-summary">
                <div class="stat-summary-card">
                    <div class="stat-summary-number" id="totalCount">0</div>
                    <div class="stat-summary-label">Total Appointments</div>
                </div>
                <div class="stat-summary-card">
                    <div class="stat-summary-number" id="upcomingCount">0</div>
                    <div class="stat-summary-label">Upcoming</div>
                </div>
                <div class="stat-summary-card">
                    <div class="stat-summary-number" id="completedCount">0</div>
                    <div class="stat-summary-label">Completed</div>
                </div>
            </div>

            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="confirmed">Confirmed</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
                <button class="filter-btn" data-filter="cancelled">Cancelled</button>
            </div>

            <div class="card">
                <div id="appointmentsList"></div>
            </div>

            <div style="text-align: center;">
                <a href="book-appointment.html" class="book-btn">+ Book New Appointment</a>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const token = getToken();
        const user = getUser();

        if (!token || user.role !== 'donor') {
            window.location.href = '/login';
        }

        let allAppointments = [];
        let currentFilter = 'all';

        async function loadAppointments() {
            const result = await getDonorAppointments(token);
            if (result.success) {
                allAppointments = result.data;
                updateStats();
                renderAppointments();
            }
        }

        function updateStats() {
            const total = allAppointments.length;
            const upcoming = allAppointments.filter(a => a.status === 'pending' || a.status === 'confirmed').length;
            const completed = allAppointments.filter(a => a.status === 'completed').length;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('upcomingCount').textContent = upcoming;
            document.getElementById('completedCount').textContent = completed;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function renderAppointments() {
            const filtered = currentFilter === 'all' ? allAppointments : allAppointments.filter(a => a.status === currentFilter);
            const container = document.getElementById('appointmentsList');
            
            if (filtered.length > 0) {
                container.innerHTML = `
                    <div class="table-wrapper">
                        <table class="appointments-table">
                            <thead><tr><th>Date</th><th>Time</th><th>Hospital</th><th>Address</th><th>Status</th><th>Action</th></tr></thead>
                            <tbody>
                                ${filtered.map(apt => `
                                    <tr>
                                        <td>${formatDate(apt.appointment_date)}</td>
                                        <td>${apt.appointment_time}</td>
                                        <td><strong>${apt.hospital_name}</strong></td>
                                        <td>${apt.address || 'Not specified'}</td>
                                        <td><span class="badge badge-${apt.status}">${apt.status}</span></td>
                                        <td>${apt.status === 'pending' ? `<button class="action-btn-cancel" onclick="cancelAppointment(${apt.appointment_id})">Cancel</button>` : '—'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else {
                container.innerHTML = `<div class="empty-state">📅 No ${currentFilter !== 'all' ? currentFilter : ''} appointments found.<br><a href="book-appointment.html">Book your first appointment!</a></div>`;
            }
        }

        function cancelAppointment(id) {
            if (confirm('Cancel this appointment?')) alert('Cancel functionality coming soon.');
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderAppointments();
            });
        });

        loadAppointments();
    </script>
    <script src="../js/icons.js"></script>
</body>
</html>
