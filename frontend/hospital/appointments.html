<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Appointments - BloodConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>

        .page-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .filter-select {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
        }

        .refresh-btn {
            padding: 0.5rem 1rem;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--card-shadow);
        }

        .action-btn {
            padding: 0.375rem 0.875rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 0 0.25rem;
        }

        .action-btn-success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .action-btn-success:hover {
            background: #10b981;
            color: white;
        }

        .action-btn-primary {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .action-btn-primary:hover {
            background: #3b82f6;
            color: white;
        }

        .action-btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .action-btn-danger:hover {
            background: #ef4444;
            color: white;
        }@media (max-width: 768px) {


            .filter-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            .action-btn {
                margin: 0.25rem 0;
                display: inline-block;
            }
        

}


    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div>
                <a href="/" class="logo">
                    <span class="logo-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5S5.5 13.8 5.5 20.2a10.5 10.5 0 0 0 21 0C26.5 13.8 16 2.5 16 2.5z" fill="#d62839"/><path d="M16 14v8M12 18h8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></span>
                    <span class="logo-text">Blood<b>Connect</b></span>
                </a>
            </div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html"><i data-icon="grid"></i> Dashboard</a></li>
                <li><a href="appointments.html" class="active"><i data-icon="calendar"></i> Appointments</a></li>
                <li><a href="blood-test.html"><i data-icon="flask"></i> Blood Test</a></li>
                <li><a href="blood-tests.html"><i data-icon="file-text"></i> Test History</a></li>
            </ul>
            <div class="theme-toggle-sidebar">
                <div class="theme-toggle" id="themeToggle">
                    <span class="theme-toggle-icon" data-theme="light"><i data-icon="sun"></i> Light</span>
                    <span class="theme-toggle-icon" data-theme="dark"><i data-icon="moon"></i> Dark</span>
                </div>
            </div>
            <div style="margin-top: 1rem;">
                <a href="#" onclick="logout()" class="btn-logout"><i data-icon="log-out"></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Appointments</h1>
                <p>View and manage all donor appointments</p>
            </div>

            <div class="filter-bar">
                <label>Filter by Status:</label>
                <select id="statusFilter" class="filter-select">
                    <option value="">All</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
                <button onclick="loadAppointments()" class="refresh-btn">Refresh</button>
            </div>

            <div class="card">
                <div id="appointmentsList"></div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const token = getToken();
        const user = getUser();

        if (!token || user.role !== 'hospital') {
            window.location.href = '/login';
        }

        async function loadAppointments() {
            const status = document.getElementById('statusFilter').value;
            let url = `${API_BASE}/hospital/appointments`;
            if (status) {
                url += `?status=${status}`;
            }
            
            const container = document.getElementById('appointmentsList');
            
            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const appointments = await response.json();
                
                if (appointments && appointments.length > 0) {
                    container.innerHTML = `
                        <div class="table-wrapper">
                             <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Donor</th>
                                        <th>Blood Group</th>
                                        <th>Date</th>
                                        <th>Time</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                     </thead>
                                <tbody>
                                    ${appointments.map(apt => {
                                        let statusClass = '';
                                        if (apt.status === 'pending') statusClass = 'badge-pending';
                                        else if (apt.status === 'confirmed') statusClass = 'badge-confirmed';
                                        else if (apt.status === 'completed') statusClass = 'badge-completed';
                                        else if (apt.status === 'cancelled') statusClass = 'badge-cancelled';
                                        
                                        let actionButtons = '';
                                        if (apt.status === 'pending') {
                                            actionButtons = `<button class="action-btn action-btn-success" onclick="updateStatus(${apt.appointment_id}, 'confirmed')">Confirm</button>`;
                                        } else if (apt.status === 'confirmed') {
                                            actionButtons = `<button class="action-btn action-btn-primary" onclick="updateStatus(${apt.appointment_id}, 'completed')">Complete</button>
                                                            <button class="action-btn action-btn-danger" onclick="updateStatus(${apt.appointment_id}, 'cancelled')">Cancel</button>`;
                                        } else if (apt.status !== 'cancelled') {
                                            actionButtons = `<button class="action-btn action-btn-danger" onclick="updateStatus(${apt.appointment_id}, 'cancelled')">Cancel</button>`;
                                        } else {
                                            actionButtons = '—';
                                        }
                                        
                                        return `
                                            <tr>
                                                <td>${apt.appointment_id}</td>
                                                <td><strong>${apt.donor_name}</strong></td>
                                                <td>${apt.blood_group}</td>
                                                <td>${fmtDate(apt.appointment_date)}</td>
                                                <td>${apt.appointment_time}</td>
                                                <td><span class="badge ${statusClass}">${apt.status}</span></td>
                                                <td>${actionButtons}</td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else {
                    container.innerHTML = '<div class="empty-state">📅 No appointments found.</div>';
                }
            } catch (error) {
                console.error('Error loading appointments:', error);
                container.innerHTML = '<div class="empty-state">Error loading appointments. Please try again.</div>';
            }
        }

        async function updateStatus(appointmentId, newStatus) {
            try {
                const response = await fetch(`${API_BASE}/hospital/appointments/${appointmentId}/update`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                
                if (response.ok) {
                    alert(`Appointment ${newStatus}!`);
                    loadAppointments();
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.error);
                }
            } catch (error) {
                console.error('Error updating appointment:', error);
                alert('Error updating appointment');
            }
        }

        loadAppointments();
    </script>
    <script src="../js/icons.js"></script>
</body>
</html>
